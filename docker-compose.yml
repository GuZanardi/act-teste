services:
  # 1. Banco de Dados MySQL
  mysql:
    image: mysql:8.0
    container_name: act_mysql_db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${HOST_DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "${DB_USER}",
          "-p${DB_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - act_network

  # 2. API Backend .NET 9
  api:
    build:
      context: ./api
      dockerfile: FinancialAccount.API/Dockerfile
    container_name: act_financial_api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:${API_PORT}
      - DB_SERVER=${DB_SERVER}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "${API_PORT}:${API_PORT}"
    networks:
      - act_network

  # 3. Frontend SPA em React + TypeScript + Tailwind CSS
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: act_financial_app
    restart: always
    depends_on:
      - api
    env_file:
      - .env
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - act_network

networks:
  act_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
